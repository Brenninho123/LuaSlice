name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-android.yml
      - project.hxp
      - hmm.json
      - source/**
      - assets/**
      - templates/**

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    defaults:
      run:
        shell: bash

    env:
      HXCPP_COMPILE_THREADS: '2'
      ANDROID_PLATFORM: android-35
      ANDROID_BUILD_TOOLS: 35.0.0
      ANDROID_NDK_VERSION: 27.2.12479018

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            libpcre2-dev \
            libgc-dev \
            libglu1-mesa-dev \
            libgl1-mesa-dev \
            libpulse-dev \
            libasound2-dev \
            libgtk-3-dev \
            unzip \
            zip

          mkdir -p .work/android-build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --licenses < /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Haxe 4.3.7 and Neko
        run: |
          set -euo pipefail

          TOOLS="$RUNNER_TEMP/luaslice-tools"

          mkdir -p \
            "$TOOLS/haxe" \
            "$TOOLS/neko" \
            "$TOOLS/haxelib"

          curl --fail --location --retry 3 \
            https://github.com/HaxeFoundation/haxe/releases/download/4.3.7/haxe-4.3.7-linux64.tar.gz \
            -o "$TOOLS/haxe.tar.gz"

          curl --fail --location --retry 3 \
            https://github.com/HaxeFoundation/neko/releases/download/v2-4-1/neko-2.4.1-linux64.tar.gz \
            -o "$TOOLS/neko.tar.gz"

          tar -xzf "$TOOLS/haxe.tar.gz" \
            --strip-components=1 \
            -C "$TOOLS/haxe"

          tar -xzf "$TOOLS/neko.tar.gz" \
            --strip-components=1 \
            -C "$TOOLS/neko"

          echo "$TOOLS/haxe" >> "$GITHUB_PATH"
          echo "$TOOLS/neko" >> "$GITHUB_PATH"

          echo "HAXEPATH=$TOOLS/haxe" >> "$GITHUB_ENV"
          echo "HAXE_STD_PATH=$TOOLS/haxe/std" >> "$GITHUB_ENV"
          echo "NEKOPATH=$TOOLS/neko" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$TOOLS/neko:/usr/local/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Install project libraries
        run: |
          set -euo pipefail

          haxe --version
          neko -version

          haxelib setup "$RUNNER_TEMP/luaslice-tools/haxelib"

          haxelib --global install hmm 3.1.0 --always --quiet

          haxelib --global run hmm install \
            2>&1 | tee .work/android-build/libraries.log

          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          dependencies = json.loads(
              pathlib.Path("hmm.json").read_text()
          )["dependencies"]

          for dependency in dependencies:
              if dependency["type"] != "git":
                  continue

              path = (
                  pathlib.Path(".haxelib")
                  / dependency["name"].replace(".", ",")
                  / "git"
              )

              if path.is_dir():
                  subprocess.run(
                      [
                          "git",
                          "-C",
                          str(path),
                          "submodule",
                          "update",
                          "--init",
                          "--recursive"
                      ],
                      check=True
                  )
          PY

      - name: Compile hxcpp tools
        run: |
          set -euo pipefail

          cd .haxelib/hxcpp/git/tools/hxcpp

          haxe compile.hxml

      - name: Configure Lime for Android
        run: |
          set -euo pipefail

          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"

          haxelib run lime setup android

      - name: Rebuild Lime for Android
        run: |
          set -euo pipefail

          haxelib run lime rebuild android -release -64 \
            2>&1 | tee .work/android-build/lime-rebuild.log

      - name: Build Android APK
        run: |
          set -euo pipefail

          haxelib run lime build android \
            -release \
            -DEXCLUDE_ARMV7 \
            2>&1 | tee .work/android-build/build.log

      - name: Collect Android APK
        run: |
          set -euo pipefail

          mkdir -p export/release/android-artifacts

          find export -type f \
            -name "*.apk" \
            -print

          mapfile -t apks < <(
            find export -type f -name "*.apk"
          )

          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No APK was generated."
            exit 1
          fi

          for apk in "${apks[@]}"; do
            filename=$(basename "$apk")

            cp "$apk" \
              "export/release/android-artifacts/$filename"
          done

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: LuaSlice-Android-${{ github.sha }}
          path: export/release/android-artifacts/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LuaSlice-Android-Logs-${{ github.sha }}
          path: .work/android-build/
          if-no-files-found: warn
          retention-days: 7
