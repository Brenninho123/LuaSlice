name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-ios.yml]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      HXCPP_COMPILE_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode and install build tools
        run: |
          mkdir -p .work/ios-build
          task_xcode=$(python3 - <<'PY'
          import pathlib, re
          candidates = []
          for path in pathlib.Path('/Applications').glob('Xcode_*.app'):
              if 'beta' in path.name.lower():
                  continue
              version = tuple(map(int, re.findall(r'\d+', path.stem)))
              if version and version[0] >= 26:
                  candidates.append((version, path))
          if not candidates:
              raise SystemExit('Xcode 26 or newer is required for DeclaredAgeRange.framework.')
          print(max(candidates)[1] / 'Contents/Developer')
          PY
          )
          echo "DEVELOPER_DIR=$task_xcode" >> "$GITHUB_ENV"
          sudo xcode-select --switch "$task_xcode"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install cmake ninja pkg-config pcre2 bdw-gc

      - name: Install Haxe 4.3.7 and Neko 2.4.1
        run: |
          task_tools="$RUNNER_TEMP/luaslice-tools"
          mkdir -p "$task_tools/haxe" "$task_tools/neko" "$task_tools/haxelib"
          curl --fail --location --retry 3 https://github.com/HaxeFoundation/haxe/releases/download/4.3.7/haxe-4.3.7-osx.tar.gz -o "$task_tools/haxe.tar.gz"
          curl --fail --location --retry 3 https://github.com/HaxeFoundation/neko/releases/download/v2-4-1/neko-2.4.1-osx-arm64.tar.gz -o "$task_tools/neko.tar.gz"
          tar -xzf "$task_tools/haxe.tar.gz" --strip-components=1 -C "$task_tools/haxe"
          tar -xzf "$task_tools/neko.tar.gz" --strip-components=1 -C "$task_tools/neko"
          echo "$task_tools/haxe" >> "$GITHUB_PATH"
          echo "$task_tools/neko" >> "$GITHUB_PATH"
          echo "HAXEPATH=$task_tools/haxe" >> "$GITHUB_ENV"
          echo "HAXE_STD_PATH=$task_tools/haxe/std" >> "$GITHUB_ENV"
          echo "NEKOPATH=$task_tools/neko" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$task_tools/neko:$(brew --prefix)/lib:${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Install pinned project libraries
        run: |
          set -o pipefail
          haxe --version
          neko -version
          haxelib setup "$RUNNER_TEMP/luaslice-tools/haxelib"
          haxelib --global install hmm 3.1.0 --always --quiet
          haxelib --global run hmm install 2>&1 | tee .work/ios-build/libraries.log
          python3 - <<'PY'
          import json, pathlib, subprocess
          for dependency in json.loads(pathlib.Path('hmm.json').read_text())['dependencies']:
              if dependency['type'] == 'git':
                  path = pathlib.Path('.haxelib') / dependency['name'].replace('.', ',') / 'git'
                  subprocess.run(['git', '-C', str(path), 'submodule', 'update', '--init', '--recursive'], check=True)
          PY
          (cd .haxelib/hxcpp/git/tools/hxcpp && haxe compile.hxml)

      - name: Build native libraries for macOS and iPhone
        run: |
          set -o pipefail
          haxelib run lime rebuild mac -release -arm64 2>&1 | tee .work/ios-build/lime-mac.log
          haxelib run lime rebuild ios -release 2>&1 | tee .work/ios-build/lime-device.log

      - name: Build unsigned release IPA
        run: |
          set -o pipefail
          haxelib run lime update ios -release 2>&1 | tee .work/ios-build/device-project.log
          xcodebuild -project export/release/ios/LuaSlice.xcodeproj -scheme LuaSlice \
            -configuration Release -sdk iphoneos SYMROOT="$PWD/export/release/ios/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" build 2>&1 | tee .work/ios-build/device-build.log
          task_stage=$(mktemp -d "$RUNNER_TEMP/luaslice-ios.XXXXXX")
          mkdir "$task_stage/Payload"
          ditto export/release/ios/build/Release-iphoneos/LuaSlice.app "$task_stage/Payload/LuaSlice.app"
          ditto -c -k --keepParent "$task_stage/Payload" export/release/LuaSlice-ios-unsigned.ipa

      - name: Build simulator release
        run: |
          set -o pipefail
          haxelib run lime rebuild ios -release -simulator -arm64 2>&1 | tee .work/ios-build/lime-simulator.log
          haxelib run lime update ios -release -simulator -arm64 2>&1 | tee .work/ios-build/simulator-project.log
          xcodebuild -project export/release/ios/LuaSlice.xcodeproj -scheme LuaSlice \
            -configuration Release -sdk iphonesimulator -arch arm64 \
            SYMROOT="$PWD/export/release/ios/build" CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build 2>&1 | tee .work/ios-build/simulator-build.log

      - name: Check simulator startup
        run: |
          task_app="$PWD/export/release/ios/build/Release-iphonesimulator/LuaSlice.app"
          test -d "$task_app"
          task_device_info=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; phones=[d for runtime,entries in devices.items() if ".iOS-" in runtime for d in entries if d["name"].startswith("iPhone")]; assert phones, "No available iPhone simulator"; device=next((d for d in phones if d["state"]=="Booted"), phones[0]); print(device["udid"], device["state"])')
          read -r task_device task_state <<< "$task_device_info"
          if [[ "$task_state" != Booted ]]; then xcrun simctl boot "$task_device"; fi
          xcrun simctl bootstatus "$task_device" -b
          xcrun simctl install "$task_device" "$task_app"
          xcrun simctl launch --console-pty "$task_device" me.luaslice > .work/ios-build/startup.log 2>&1 &
          task_process=$!
          trap 'kill "$task_process" 2>/dev/null || true' EXIT
          task_ready=false
          for ((task_attempt=0; task_attempt<180; task_attempt++)); do
            kill -0 "$task_process"
            if grep -Eq 'Fatal Uncaught|Null Object Reference|Loading failed:' .work/ios-build/startup.log; then
              cat .work/ios-build/startup.log
              exit 1
            fi
            if grep -q 'Opening Attract state in' .work/ios-build/startup.log; then
              task_ready=true
              break
            fi
            sleep 1
          done
          [[ "$task_ready" == true ]]
          sleep 15
          kill -0 "$task_process"
          if grep -Eq 'Fatal Uncaught|Null Object Reference|Loading failed:' .work/ios-build/startup.log; then
            cat .work/ios-build/startup.log
            exit 1
          fi
          xcrun simctl io "$task_device" screenshot .work/ios-build/title.png
          ditto -c -k --keepParent "$task_app" export/release/LuaSlice-ios-simulator.zip

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LuaSlice-ios-${{ github.sha }}
          path: |
            export/release/LuaSlice-ios-unsigned.ipa
            export/release/LuaSlice-ios-simulator.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LuaSlice-ios-logs-${{ github.sha }}
          path: .work/ios-build
          if-no-files-found: warn
          retention-days: 7
